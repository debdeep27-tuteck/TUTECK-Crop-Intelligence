<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropAI — Sign In</title>
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f7f5f0;
            --border: #e0ddd5;
            --border2: #c8c4b8;
            --leaf: #4a7c59;
            --text: #1a1a18;
            --text2: #33332e;
            --text3: #8e8e0c;
            --amber: #c9922a;
            --sky: #0ea5e9;
            --red: #c0392b;
            --mono: 'DM Mono', monospace;
            --head: 'DM Serif Display', serif;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(74, 124, 89, 0.08), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.06), transparent 45%);
            pointer-events: none;
        }

        .login-card {
            position: relative;
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px 32px 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.07);
            backdrop-filter: blur(6px);
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 6px;
        }

        .brand-logo {
            height: 30px;
            width: auto;
            object-fit: contain;
        }

        .login-title {
            font-family: var(--head);
            font-size: 22px;
            color: var(--leaf);
            text-align: center;
            letter-spacing: 0.3px;
        }

        .login-sub {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text3);
            text-align: center;
            margin-top: 6px;
            margin-bottom: 22px;
        }

        .auth-tabs {
            display: flex;
            border: 1px solid var(--border2);
            border-radius: 7px;
            padding: 3px;
            margin-bottom: 22px;
            background: rgba(0, 0, 0, 0.02);
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text3);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }

        .auth-tab.active {
            background: var(--leaf);
            color: #fff;
        }

        .field-group {
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text2);
            margin-bottom: 6px;
        }

        .field-input,
        .field-select {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border2);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            appearance: none;
        }

        .field-input:focus,
        .field-select:focus {
            border-color: var(--leaf);
            box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.12);
        }

        .field-select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2333332e' d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 18px;
            cursor: pointer;
        }

        .role-hint {
            font-family: var(--mono);
            font-size: 9px;
            color: var(--text3);
            margin-top: 5px;
            letter-spacing: 0.05em;
        }

        .login-btn {
            width: 100%;
            height: 42px;
            margin-top: 8px;
            background: var(--leaf);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .login-btn:hover {
            background: #3d6a49;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            background: var(--border2);
            cursor: not-allowed;
        }

        .error-msg,
        .success-msg {
            display: none;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.04em;
            border-radius: 5px;
            padding: 8px 10px;
            margin-bottom: 14px;
        }

        .error-msg {
            color: var(--red);
            background: rgba(192, 57, 43, 0.08);
            border: 1px solid rgba(192, 57, 43, 0.25);
        }

        .success-msg {
            color: var(--leaf);
            background: rgba(74, 124, 89, 0.08);
            border: 1px solid rgba(74, 124, 89, 0.25);
        }

        .error-msg.show,
        .success-msg.show {
            display: block;
        }

        .switch-note {
            margin-top: 18px;
            text-align: center;
            font-family: var(--mono);
            font-size: 9.5px;
            color: var(--text3);
            letter-spacing: 0.03em;
        }

        .switch-note a {
            color: var(--leaf);
            cursor: pointer;
            text-decoration: underline;
        }

        .demo-note {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px dashed var(--border2);
            font-family: var(--mono);
            font-size: 9px;
            line-height: 1.7;
            color: var(--text3);
            letter-spacing: 0.02em;
        }

        .demo-note b {
            color: var(--text2);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--leaf);
            display: inline-block;
            margin-right: 6px;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .25
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-brand">
            <img src="/static/tuteck_logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        </div>
        <div class="login-title">Crop Intelligence</div>
        <div class="login-sub"><span class="live-dot"></span><span id="mode-sub">Sign in to continue</span></div>

        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-signin" onclick="setMode('signin')">Sign In</div>
            <div class="auth-tab" id="tab-signup" onclick="setMode('signup')">Sign Up</div>
        </div>

        <div class="error-msg" id="error-msg"></div>
        <div class="success-msg" id="success-msg"></div>

        <form id="signin-form" autocomplete="off">
            <div class="field-group">
                <label class="field-label" for="signin-email">Email</label>
                <input class="field-input" type="email" id="signin-email" placeholder="you@example.com" required>
            </div>
            <div class="field-group">
                <label class="field-label" for="signin-password">Password</label>
                <input class="field-input" type="password" id="signin-password" placeholder="••••••••" required>
            </div>
            <button class="login-btn" type="submit" id="signin-btn">Sign In</button>
        </form>

        <form id="signup-form" class="hidden" autocomplete="off">
            <div class="field-group">
                <label class="field-label" for="signup-email">Email</label>
                <input class="field-input" type="email" id="signup-email" placeholder="you@example.com" required>
            </div>
            <div class="field-group">
                <label class="field-label" for="signup-password">Password</label>
                <input class="field-input" type="password" id="signup-password" placeholder="Create a password" required
                    minlength="6">
            </div>
            <div class="field-group">
                <label class="field-label" for="signup-role">Role</label>
                <select class="field-select" id="signup-role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="admin">Admin — full access</option>
                    <option value="analyst">Analyst — dashboard &amp; reports</option>
                    <option value="farmer">Farmer — irrigation, disease &amp; recommender</option>
                </select>
                <div class="role-hint">You'll only pick this once — future sign-ins just need email &amp; password.
                </div>
            </div>
            <button class="login-btn" type="submit" id="signup-btn">Create Account</button>
        </form>

        <div class="switch-note" id="switch-note">
            New here? <a onclick="setMode('signup')">Create an account</a>
        </div>

        <div class="demo-note">
            <b>Note</b> — sign up once with your role; future sign-ins only need your email &amp; password.
        </div>
    </div>

    <script>
        /*
          ── AUTH: calls the Flask gateway's /api/auth endpoints ────────────────
          See gateway.py: /api/auth/signup, /api/auth/login, /api/auth/me,
          /api/auth/logout. Passwords are hashed server-side (werkzeug), never
          stored in plaintext, and role is looked up server-side on sign-in —
          the client never re-submits or can spoof its own role.
        */

        const SESSION_KEY = 'cropai_session'; // { token, email, role, loggedInAt }

        async function apiPost(path, body) {
            const res = await fetch(path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            let data = {};
            try { data = await res.json(); } catch { }
            if (!res.ok) throw new Error(data.error || 'Request failed.');
            return data;
        }

        async function signUp(email, password, role) {
            return apiPost('/api/auth/signup', { email, password, role });
        }

        async function signIn(email, password) {
            return apiPost('/api/auth/login', { email, password });
        }

        const modeSub = document.getElementById('mode-sub');
        const tabSignin = document.getElementById('tab-signin');
        const tabSignup = document.getElementById('tab-signup');
        const signinForm = document.getElementById('signin-form');
        const signupForm = document.getElementById('signup-form');
        const switchNote = document.getElementById('switch-note');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        function clearMsgs() {
            errorMsg.classList.remove('show'); errorMsg.textContent = '';
            successMsg.classList.remove('show'); successMsg.textContent = '';
        }
        function showError(msg) { clearMsgs(); errorMsg.textContent = msg; errorMsg.classList.add('show'); }
        function showSuccess(msg) { clearMsgs(); successMsg.textContent = msg; successMsg.classList.add('show'); }

        function setMode(mode) {
            clearMsgs();
            if (mode === 'signup') {
                tabSignup.classList.add('active'); tabSignin.classList.remove('active');
                signupForm.classList.remove('hidden'); signinForm.classList.add('hidden');
                modeSub.textContent = 'Create your account';
                switchNote.innerHTML = 'Already have an account? <a onclick="setMode(\'signin\')">Sign in</a>';
            } else {
                tabSignin.classList.add('active'); tabSignup.classList.remove('active');
                signinForm.classList.remove('hidden'); signupForm.classList.add('hidden');
                modeSub.textContent = 'Sign in to continue';
                switchNote.innerHTML = 'New here? <a onclick="setMode(\'signup\')">Create an account</a>';
            }
        }

        function startSession(user) {
            localStorage.setItem(
                SESSION_KEY,
                JSON.stringify({
                    token: user.token,
                    email: user.email,
                    role: user.role,
                    loggedInAt: Date.now()
                })
            );

            if (user.role === "admin") {
                window.location.href = "/admin";
            } else {
                window.location.href = "/dashboard";
            }
        }

        signinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMsgs();
            const email = document.getElementById('signin-email').value.trim();
            const password = document.getElementById('signin-password').value;
            if (!email || !password) { showError('Please fill in all fields.'); return; }

            const btn = document.getElementById('signin-btn');
            btn.disabled = true; btn.textContent = 'Signing in…';
            try {
                const user = await signIn(email, password);
                startSession(user);
            } catch (err) {
                showError(err.message || 'Sign in failed.');
                btn.disabled = false; btn.textContent = 'Sign In';
            }
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMsgs();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const role = document.getElementById('signup-role').value;
            if (!email || !password || !role) { showError('Please fill in all fields.'); return; }
            if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }

            const btn = document.getElementById('signup-btn');
            btn.disabled = true; btn.textContent = 'Creating account…';
            try {
                await signUp(email, password, role);
                showSuccess('Account created! You can now sign in with your email & password.');
                signupForm.reset();
                setTimeout(() => setMode('signin'), 900);
            } catch (err) {
                showError(err.message || 'Sign up failed.');
            } finally {
                btn.disabled = false; btn.textContent = 'Create Account';
            }
        });

        (function checkExistingSession() {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                if (raw) {
                    const session = JSON.parse(raw);
                    if (session && session.token) window.location.href = '/dashboard';
                }
            } catch { }
        })();
    </script>
</body>

</html>
