<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CropAI — Enterprise Sign In</title>
  <link rel="shortcut icon" href="../static/favicon.ico" type="image/x-icon">
  <link rel="icon" href="../static/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/design_system.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #F8FAFC;
      background-image: radial-gradient(#E2E8F0 1px, transparent 1px);
      background-size: 24px 24px;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 32px 30px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--primary);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(6, 78, 59, 0.25);
    }

    .auth-logo svg {
      width: 24px;
      height: 24px;
    }

    .auth-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .auth-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .auth-nav {
      display: flex;
      background: #F1F5F9;
      padding: 3px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .auth-tab.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: var(--shadow-xs);
    }

    .hidden {
      display: none !important;
    }

    .auth-footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .auth-footer-note a {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .auth-footer-note a:hover {
      text-decoration: underline;
    }

    .alert-msg {
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
    }

    .alert-msg.show {
      display: block;
    }

    .alert-msg.error {
      background: #FEE2E2;
      color: var(--danger);
      border: 1px solid #FECACA;
    }

    .alert-msg.success {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--success-border);
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
        </svg>
      </div>
      <div class="auth-title">CropAI Enterprise</div>
      <div class="auth-sub" id="mode-sub">Sign in to access agricultural intelligence</div>
    </div>

    <!-- Toggle Sign In / Create Account -->
    <div class="auth-nav">
      <div class="auth-tab active" id="tab-signin" onclick="setMode('signin')">Sign In</div>
      <div class="auth-tab" id="tab-signup" onclick="setMode('signup')">Create Account</div>
    </div>

    <div class="alert-msg error" id="error-msg"></div>
    <div class="alert-msg success" id="success-msg"></div>

    <!-- Sign In Form -->
    <form id="signin-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="signin-email" placeholder="name@domain.gov.in" style="width:100%;"
          required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="signin-password" placeholder="••••••••" style="width:100%;"
          required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="signin-btn" style="width:100%;height:40px;margin-top:10px;">
        Sign In
      </button>
    </form>

    <!-- Sign Up Form -->
    <form id="signup-form" class="hidden">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="signup-email" placeholder="name@domain.gov.in" style="width:100%;"
          required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="signup-password" placeholder="Min. 6 characters"
          style="width:100%;" required>
      </div>
      <div class="form-group">
        <label class="form-label">Account Role</label>
        <select class="form-select" id="signup-role" style="width:100%;" required>
          <option value="farmer">Farmer / Field Operator</option>
          <option value="district_admin">District Agriculture Officer</option>
          <option value="state_admin">State Administrator</option>
          <option value="analyst">Agronomic Analyst</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" id="signup-btn" style="width:100%;height:40px;margin-top:10px;">
        Create Account
      </button>
    </form>

    <div class="auth-footer-note" id="switch-note">
      New to CropAI? <a onclick="setMode('signup')">Create an account</a>
    </div>

    <div style="margin-top:16px;">
      <div style="font-size:11px;color:var(--text-muted);text-align:center;margin-bottom:8px;">Quick login as role</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;" id="role-buttons">
        <button type="button" class="btn btn-primary role-demo-btn" style="flex:1;min-width:90px;height:36px;" data-role="admin">Admin</button>
        <button type="button" class="btn btn-primary role-demo-btn" style="flex:1;min-width:90px;height:36px;background:#0F766E;" data-role="analyst">Analyst</button>
        <button type="button" class="btn btn-primary role-demo-btn" style="flex:1;min-width:90px;height:36px;background:#15803D;" data-role="farmer">Farmer</button>
        <button type="button" class="btn btn-primary role-demo-btn" style="flex:1;min-width:90px;height:36px;background:#1D4ED8;" data-role="state_admin">State Admin</button>
        <button type="button" class="btn btn-primary role-demo-btn" style="flex:1;min-width:90px;height:36px;background:#7C3AED;" data-role="district_admin">District Admin</button>
        <button type="button" class="btn btn-primary role-demo-btn" style="flex:1;min-width:90px;height:36px;background:#B45309;" data-role="mandi">Mandi</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/auth';
    const SESSION_KEY = 'cropai_session';

    async function signIn(email, password) {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Sign in failed');
      return data;
    }

    async function signUp(email, password, role) {
      const res = await fetch(`${API_BASE}/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Sign up failed');
      return data;
    }

    const modeSub = document.getElementById('mode-sub');
    const tabSignin = document.getElementById('tab-signin');
    const tabSignup = document.getElementById('tab-signup');
    const signinForm = document.getElementById('signin-form');
    const signupForm = document.getElementById('signup-form');
    const switchNote = document.getElementById('switch-note');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');

    function clearMsgs() {
      errorMsg.classList.remove('show'); errorMsg.textContent = '';
      successMsg.classList.remove('show'); successMsg.textContent = '';
    }
    function showError(msg) { clearMsgs(); errorMsg.textContent = msg; errorMsg.classList.add('show'); }
    function showSuccess(msg) { clearMsgs(); successMsg.textContent = msg; successMsg.classList.add('show'); }

    function setMode(mode) {
      clearMsgs();
      if (mode === 'signup') {
        tabSignup.classList.add('active'); tabSignin.classList.remove('active');
        signupForm.classList.remove('hidden'); signinForm.classList.add('hidden');
        modeSub.textContent = 'Create your authorized account';
        switchNote.innerHTML = 'Already have an account? <a onclick="setMode(\'signin\')">Sign in</a>';
      } else {
        tabSignin.classList.add('active'); tabSignup.classList.remove('active');
        signinForm.classList.remove('hidden'); signupForm.classList.add('hidden');
        modeSub.textContent = 'Sign in to access agricultural intelligence';
        switchNote.innerHTML = 'New to CropAI? <a onclick="setMode(\'signup\')">Create an account</a>';
      }
    }

    function startSession(user) {
      localStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
          token: user.token,
          email: user.email,
          role: user.role,
          loggedInAt: Date.now(),
          state: user.state,
          district: user.district
        })
      );

      // All roles, including admin, land on the dashboard first.
      // Admins can navigate to the admin panel from there via the sidebar.
      window.location.href = "/dashboard";
    }

    signinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsgs();
      const email = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value;
      if (!email || !password) { showError('Please fill in all fields.'); return; }

      const btn = document.getElementById('signin-btn');
      btn.disabled = true; btn.textContent = 'Authenticating…';
      try {
        const user = await signIn(email, password);
        startSession(user);
      } catch (err) {
        showError(err.message || 'Authentication failed.');
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsgs();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const role = document.getElementById('signup-role').value;
      if (!email || !password || !role) { showError('Please fill in all fields.'); return; }
      if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }

      const btn = document.getElementById('signup-btn');
      btn.disabled = true; btn.textContent = 'Creating account…';
      try {
        await signUp(email, password, role);
        showSuccess('Account created successfully. You can now sign in.');
        signupForm.reset();
        setTimeout(() => setMode('signin'), 900);
      } catch (err) {
        showError(err.message || 'Registration failed.');
      } finally {
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    });

    (function checkExistingSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (raw) {
          const session = JSON.parse(raw);
          if (session && session.token) window.location.href = '/dashboard';
        }
      } catch { }
    })();

    async function fillDemoRole(role) {
      clearMsgs();
      try {
        const res = await fetch(`/api/auth/demo-user/${encodeURIComponent(role)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || data.error || 'Failed to load demo user');
        document.getElementById('signin-email').value = data.email || '';
        document.getElementById('signin-password').value = data.password || '';
        showSuccess(`Demo ${role.replace('_',' ')} credentials loaded`);
      } catch (err) {
        showError(err.message || 'Unable to load demo credentials.');
      }
    }

    document.querySelectorAll('.role-demo-btn').forEach((btn) => {
      btn.addEventListener('click', () => fillDemoRole(btn.getAttribute('data-role')));
    });
  </script>
</body>

</html>
