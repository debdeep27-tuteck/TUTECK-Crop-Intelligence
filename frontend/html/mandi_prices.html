<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mandi Prices</title>
<style>
  :root {
    --green: #14A800;
    --green-dark: #0d7d00;
    --border: #e2e2e2;
    --bg: #f7f9f7;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: #222;
  }
  h1 { margin: 0 0 4px; color: var(--green-dark); font-size: 22px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 18px; }

  .filters {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
    background: white;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
  .field label { font-size: 12px; font-weight: 600; color: #555; }
  .field label .required { color: #b00020; margin-left: 2px; }
  .field label .optional { color: #999; font-weight: 400; }
  select {
    padding: 9px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    background: white;
  }
  select:disabled { background: #f1f1f1; color: #999; }

  /* State lock badge */
  .state-locked-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .state-locked-wrap select {
    padding-right: 32px; /* room for lock icon */
    border-color: var(--green);
    background: #f4fbf4;
    color: #333;
    cursor: default;
    font-weight: 600;
  }
  .lock-badge {
    position: absolute;
    right: 28px; /* sits inside the select, left of the native caret */
    display: flex;
    align-items: center;
    pointer-events: none;
    color: var(--green-dark);
    opacity: 0.75;
  }
  .lock-badge svg { width: 13px; height: 13px; }
  .lock-hint {
    font-size: 10.5px;
    color: var(--green-dark);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  button.search-btn {
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    background: var(--green);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button.search-btn:hover { background: var(--green-dark); }
  button.search-btn:disabled { background: #aaa; cursor: not-allowed; }

  .status { padding: 14px; font-size: 14px; color: #555; }
  .status.error { color: #b00020; }

  .table-wrap {
    background: white;
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: auto;
    display: none;
  }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th, td {
    padding: 10px 12px;
    text-align: left;
    font-size: 13.5px;
    border-bottom: 1px solid #f0f0f0;
    white-space: nowrap;
  }
  th {
    background: var(--green);
    color: white;
    position: sticky;
    top: 0;
    font-weight: 600;
  }
  tr:hover td { background: #f3fbf1; }
  .price { font-weight: 600; }
  .modal-price { color: var(--green-dark); }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: #777;
    margin-bottom: 8px;
  }

  /* Pagination */
  .pagination {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
    padding: 14px 12px;
    background: white;
    border-top: 1px solid var(--border);
  }
  .pagination button {
    min-width: 34px;
    height: 34px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid #ddd;
    background: white;
    color: #333;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .pagination button:hover:not(:disabled):not(.active) { background: #f3fbf1; border-color: var(--green); }
  .pagination button.active {
    background: var(--green);
    border-color: var(--green);
    color: white;
    cursor: default;
  }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pagination .ellipsis {
    padding: 0 4px;
    color: #999;
    font-size: 13px;
    user-select: none;
  }
</style>
</head>
<body>

<h1>Mandi Prices</h1>
<div class="subtitle">
  Daily market prices across Districts and States
</div>

<div class="filters">
  <div class="field">
    <label for="stateSelect">State <span class="required">*</span></label>
    <div class="state-locked-wrap">
      <select id="stateSelect" disabled></select>
      
    </div>
    <!-- <span class="lock-hint">
      <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Set from top bar
    </span> -->
  </div>

  <div class="field">
    <label for="districtSelect">District <span class="optional">(optional)</span></label>
    <select id="districtSelect" disabled>
      <option value="">All districts</option>
    </select>
  </div>

  <div class="field">
    <label for="commoditySelect">Crop Type <span class="optional">(optional)</span></label>
    <select id="commoditySelect" disabled>
      <option value="">All crops</option>
    </select>
  </div>

  <button class="search-btn" id="searchBtn">Get Prices</button>
</div>

<div class="meta-row" id="metaRow" style="display:none">
  <span id="metaText"></span>
  <span id="updatedText"></span>
</div>

<div class="status" id="status">Select a state, then click "Get Prices."</div>

<div class="table-wrap" id="tableWrap">
  <table>
    <thead>
      <tr>
        <th>Commodity</th>
        <th>Variety</th>
        <th>Grade</th>
        <th>Market</th>
        <th>Min Price (₹/Qtl)</th>
        <th>Max Price (₹/Qtl)</th>
        <th>Modal Price (₹/Qtl)</th>
        <th>Arrival Date</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="pagination" id="pagination"></div>
</div>

<script>
// This page is served by gateway.py at /content/mandi-prices.
//   - Dropdowns (district, crop type) are populated from the site's own
//     crop backend via /api/crop/valid_districts and /api/crop/valid_crops
//     (the exact same lists every other tab on the dashboard already
//     uses) — NOT from data.gov.in. This keeps district/crop naming
//     consistent across the whole site and avoids an extra network hop.
//   - The actual price table comes from /api/mandi-prices/prices, which
//     gateway.py proxies to mandi_prices_backend.py, which in turn calls
//     data.gov.in (Agmarknet) live.
const CROP_API = "/api/crop";
const MANDI_API = "/api/mandi-prices";

// Must match SUPPORTED_STATES in mandi_prices_backend.py and CROP_BACKENDS
// in main.py/gateway.py. Kept as a small static list here since state
// selection also drives which crop-backend instance /api/crop/* resolves
// to (gateway.py picks the backend from ?state=).
const STATES = [
  { id: "tripura", name: "Tripura" },
  { id: "meghalaya", name: "Meghalaya" },
  { id: "rajasthan", name: "Rajasthan" },
];

const PAGE_SIZE = 10;

const stateSelect = document.getElementById("stateSelect");
const districtSelect = document.getElementById("districtSelect");
const commoditySelect = document.getElementById("commoditySelect");
const searchBtn = document.getElementById("searchBtn");
const statusEl = document.getElementById("status");
const tableWrap = document.getElementById("tableWrap");
const tableBody = document.getElementById("tableBody");
const metaRow = document.getElementById("metaRow");
const metaText = document.getElementById("metaText");
const updatedText = document.getElementById("updatedText");
const paginationEl = document.getElementById("pagination");

// Holds the full result set for the current search; the table only
// ever renders one page-worth (PAGE_SIZE) of it at a time.
let allRecords = [];
let currentPage = 1;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (isError ? " error" : "");
  statusEl.style.display = "block";
}

async function fetchJSON(url) {
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error || `Request failed (${res.status})`);
  }
  return data;
}

// ── Sync state from the top-bar (index.html) ──────────────────────────────
// index.html loads this page as  /content/mandi-prices?state=<state>  and
// also keeps the active state in localStorage under 'cropai_state'.  We
// read both sources so the page works when opened standalone too.
function getActiveState() {
  const urlState = new URLSearchParams(window.location.search).get('state');
  if (urlState) {
    const s = urlState.toLowerCase().trim();
    if (STATES.some(x => x.id === s)) return s;
  }
  const stored = (localStorage.getItem('cropai_state') || '').toLowerCase().trim();
  if (STATES.some(x => x.id === stored)) return stored;
  return STATES[0].id; // fallback to first
}

function initStates() {
  const activeState = getActiveState();
  stateSelect.innerHTML = "";
  STATES.forEach(s => stateSelect.add(new Option(s.name, s.id)));
  stateSelect.value = activeState; // pre-select from top bar
  loadDropdowns(); // load districts/crops for that state
}

async function loadDropdowns() {
  const state = stateSelect.value;
  districtSelect.disabled = true;
  commoditySelect.disabled = true;
  districtSelect.innerHTML = '<option value="">Loading…</option>';
  commoditySelect.innerHTML = '<option value="">Loading…</option>';

  try {
    const [districtsData, cropsData] = await Promise.all([
      fetchJSON(`${CROP_API}/valid_districts?state=${encodeURIComponent(state)}`),
      fetchJSON(`${CROP_API}/valid_crops?state=${encodeURIComponent(state)}`),
    ]);

    districtSelect.innerHTML = '<option value="">All districts</option>';
    (districtsData.valid_districts || []).forEach(d => districtSelect.add(new Option(d, d)));
    districtSelect.disabled = false;

    commoditySelect.innerHTML = '<option value="">All crops</option>';
    (cropsData.valid_crops || []).forEach(c => commoditySelect.add(new Option(c, c)));
    commoditySelect.disabled = false;
  } catch (err) {
    setStatus("Could not load district/crop lists from the crop backend. " + err.message, true);
    districtSelect.innerHTML = '<option value="">All districts</option>';
    commoditySelect.innerHTML = '<option value="">All crops</option>';
  }
}

async function loadPrices() {
  const state = stateSelect.value;
  const district = districtSelect.value;
  const commodity = commoditySelect.value;

  if (!state) {
    setStatus("Please select a state.", true);
    return;
  }

  searchBtn.disabled = true;
  tableWrap.style.display = "none";
  metaRow.style.display = "none";
  setStatus("Fetching today's prices…");

  try {
    const params = new URLSearchParams({ state, limit: "200" });
    if (district) params.set("district", district);
    if (commodity) params.set("commodity", commodity);

    const data = await fetchJSON(`${MANDI_API}/prices?${params.toString()}`);

    if (!data.records || data.records.length === 0) {
      allRecords = [];
      setStatus("No price records found for this selection today. Try widening your filters (e.g. remove the crop type) or check back later.");
      return;
    }

    allRecords = data.records;
    currentPage = 1;

    updatedText.textContent = data.updated ? `Dataset updated: ${data.updated}` : "";

    renderPage();

    statusEl.style.display = "none";
    tableWrap.style.display = "block";
  } catch (err) {
    setStatus("Could not fetch prices. " + err.message, true);
  } finally {
    searchBtn.disabled = false;
  }
}

function renderPage() {
  const totalRecords = allRecords.length;
  const totalPages = Math.max(1, Math.ceil(totalRecords / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRecords = allRecords.slice(start, start + PAGE_SIZE);

  tableBody.innerHTML = pageRecords.map(r => `
    <tr>
      <td>${escapeHtml(r.commodity)}</td>
      <td>${escapeHtml(r.variety)}</td>
      <td>${escapeHtml(r.grade)}</td>
      <td>${escapeHtml(r.market)}</td>
      <td class="price">${formatPrice(r.min_price)}</td>
      <td class="price">${formatPrice(r.max_price)}</td>
      <td class="price modal-price">${formatPrice(r.modal_price)}</td>
      <td>${escapeHtml(r.arrival_date)}</td>
    </tr>
  `).join("");

  const shownStart = totalRecords === 0 ? 0 : start + 1;
  const shownEnd = Math.min(start + PAGE_SIZE, totalRecords);
  metaText.textContent = `Showing ${shownStart}-${shownEnd} of ${totalRecords} record(s)`;
  metaRow.style.display = "flex";

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  if (totalPages <= 1) {
    paginationEl.style.display = "none";
    paginationEl.innerHTML = "";
    return;
  }

  paginationEl.style.display = "flex";

  const buttons = [];

  buttons.push(`<button data-page="prev" ${currentPage === 1 ? "disabled" : ""} title="Previous page">‹</button>`);

  // Build a compact page list: first, last, current ±1, with ellipses.
  const pages = new Set([1, totalPages, currentPage, currentPage - 1, currentPage + 1]);
  const sortedPages = [...pages].filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b);

  let prevPage = null;
  sortedPages.forEach(p => {
    if (prevPage !== null && p - prevPage > 1) {
      buttons.push(`<span class="ellipsis">…</span>`);
    }
    buttons.push(`<button data-page="${p}" class="${p === currentPage ? "active" : ""}">${p}</button>`);
    prevPage = p;
  });

  buttons.push(`<button data-page="next" ${currentPage === totalPages ? "disabled" : ""} title="Next page">›</button>`);

  paginationEl.innerHTML = buttons.join("");
}

paginationEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-page]");
  if (!btn || btn.disabled) return;

  const target = btn.dataset.page;
  if (target === "prev") {
    currentPage -= 1;
  } else if (target === "next") {
    currentPage += 1;
  } else {
    currentPage = parseInt(target, 10);
  }
  renderPage();
  tableWrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
});

function formatPrice(v) {
  if (v === null || v === undefined) return "-";
  return "₹" + Number(v).toLocaleString("en-IN");
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// State is locked to top-bar — no change listener needed on stateSelect.
searchBtn.addEventListener("click", loadPrices);

initStates();
</script>

</body>
</html>
