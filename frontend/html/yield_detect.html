<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yield Detect — CropAI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/yield_detect.css">
<style>
  /* Summary stat cards — matches the EWAS "CRITICAL ALERTS / WATCH ALERTS…"
     card row styling: cream card, mono uppercase label, big bold number,
     small muted subtitle underneath. Self-contained so it renders correctly
     even if yield_detect.css doesn't define these classes yet. */
  .yd-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border: 1px solid #d8d3c4;
    border-radius: 4px;
    margin: 0 0 18px;
    background: #faf8f2;
  }
  .yd-stat-card {
    padding: 18px 22px;
    border-right: 1px solid #d8d3c4;
  }
  .yd-stat-card:last-child {
    border-right: none;
  }
  .yd-stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #8a8470;
    margin-bottom: 8px;
  }
  .yd-stat-value {
    font-family: 'DM Serif Display', serif;
    font-size: 34px;
    line-height: 1;
    color: #2c2a20;
  }
  .yd-stat-value.alert {
    color: #b3402a;
  }
  .yd-stat-sub {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    color: #9b9580;
    margin-top: 6px;
  }
  @media (max-width: 760px) {
    .yd-stats {
      grid-template-columns: repeat(2, 1fr);
    }
    .yd-stat-card:nth-child(2) {
      border-right: none;
    }
    .yd-stat-card:nth-child(3),
    .yd-stat-card:nth-child(4) {
      border-top: 1px solid #d8d3c4;
    }
  }
</style>
</head>
<body>

  <div class="yd-header">
    <div>
      <div class="yd-title">🛰️ Yield Detect — By Land</div>
      <div class="yd-subtitle" id="yd-subtitle">LOADING…</div>
    </div>
    <button class="btn btn-primary" id="add-land-btn" onclick="goAddLand()" style="display:none;">＋ Add Land</button>
  </div>

  <div class="yd-content">

    <div class="yd-stats" id="yd-stats">
      <div class="yd-stat-card">
        <div class="yd-stat-label">Lands Detected</div>
        <div class="yd-stat-value" id="stat-lands">—</div>
        <div class="yd-stat-sub" id="stat-lands-sub">&nbsp;</div>
      </div>
      <div class="yd-stat-card">
        <div class="yd-stat-label">Distinct Farmers</div>
        <div class="yd-stat-value" id="stat-farmers">—</div>
        <div class="yd-stat-sub" id="stat-farmers-sub">&nbsp;</div>
      </div>
      <div class="yd-stat-card">
        <div class="yd-stat-label">Crop Types</div>
        <div class="yd-stat-value" id="stat-crops">—</div>
        <div class="yd-stat-sub" id="stat-crops-sub">&nbsp;</div>
      </div>
      <div class="yd-stat-card">
        <div class="yd-stat-label">Anomaly Alerts</div>
        <div class="yd-stat-value" id="stat-anomalies">—</div>
        <div class="yd-stat-sub" id="stat-anomalies-sub">&nbsp;</div>
      </div>
    </div>

    <div class="yd-table-wrap">
      <table class="yd-table">
        <thead>
          <tr>
            <th>Property</th>
            <th>District</th>
            <th>Crop</th>
            <th>Area (Ha)</th>
            <th>Predicted Yield</th>
            <th>Anomaly</th>
            <th>Updated</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="lands-tbody">
          <tr><td colspan="8" class="yd-empty">Loading land records…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Same session pattern as admin.html: cropai_session in localStorage,
    // holding { token, uid, email, role }.
    const SESSION_KEY = "cropai_session";

    function getSession() {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      try { return JSON.parse(raw); } catch { return null; }
    }

    const session = getSession();

    // Everyone with a valid session can view Yield Detect. Farmers get full
    // add/edit/delete on their own land records; admin/state_admin/
    // district_admin can additionally delete any land record (moderation),
    // but can't add or edit one (that stays farmer-only).
    if (!session) {
      window.top.location.href = '/dashboard';
      throw new Error('Not logged in.');
    }
    const ROLE = (session.role || '').toLowerCase();
    const IS_FARMER = ROLE === 'farmer';
    const CAN_DELETE = IS_FARMER || ['admin', 'state_admin', 'district_admin'].includes(ROLE);
    const addBtn = document.getElementById('add-land-btn');
    if (addBtn) addBtn.style.display = IS_FARMER ? '' : 'none';

    function authHeaders(extra) {
      return Object.assign({ "Authorization": "Bearer " + session.token }, extra || {});
    }

    // Read the active state the same way the shell app does.
    function getUrlState() {
      const params = new URLSearchParams(window.location.search);
      return (params.get('state') || 'tripura').toLowerCase();
    }
    const STATE = getUrlState();
    const STATE_LABEL = STATE.charAt(0).toUpperCase() + STATE.slice(1);
    document.getElementById('yd-subtitle').textContent = `${STATE_LABEL} · Land-wise yield predictions from geofenced plots`;

    function goAddLand() {
      window.top.location.href = `/yield-detect-editor?state=${STATE}`;
    }

    function goEditLand(id) {
      window.top.location.href = `/yield-detect-editor?state=${STATE}&id=${id}`;
    }

    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.toggle('error', !!isError);
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function fmt(n, digits = 2) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return Number(n).toFixed(digits);
    }

    function anomalyPill(anomaly) {
      if (anomaly === null || anomaly === undefined) return '<span class="yd-pill">—</span>';
      const cls = anomaly < -10 ? 'bad' : (anomaly < 0 ? 'warn' : '');
      const sign = anomaly > 0 ? '+' : '';
      return `<span class="yd-pill ${cls}">${sign}${fmt(anomaly, 1)}%</span>`;
    }

    // Anomaly threshold for flagging a land as an "alert" here mirrors the
    // EWAS Watch/Critical banding: anything at or below -10% predicted vs.
    // normal yield counts as an anomaly worth surfacing.
    const ANOMALY_ALERT_THRESHOLD = -10;

    function updateStats(lands) {
      const total = lands.length;

      const farmerSet = new Set(lands.map(l => l.user_email).filter(Boolean));
      const cropSet = new Set(lands.map(l => l.crop).filter(Boolean));
      const anomalies = lands.filter(l =>
        l.anomaly_pct !== null && l.anomaly_pct !== undefined && l.anomaly_pct <= ANOMALY_ALERT_THRESHOLD
      );

      document.getElementById('stat-lands').textContent = total;
      document.getElementById('stat-lands-sub').textContent = `across ${STATE_LABEL}`;

      document.getElementById('stat-farmers').textContent = farmerSet.size;
      document.getElementById('stat-farmers-sub').textContent = 'unique growers';

      document.getElementById('stat-crops').textContent = cropSet.size;
      document.getElementById('stat-crops-sub').textContent = 'distinct crops';

      const anomalyEl = document.getElementById('stat-anomalies');
      anomalyEl.textContent = anomalies.length;
      anomalyEl.classList.toggle('alert', anomalies.length > 0);
      document.getElementById('stat-anomalies-sub').textContent = `anomaly ≤ ${ANOMALY_ALERT_THRESHOLD}%`;
    }

    async function loadLands() {
      const tbody = document.getElementById('lands-tbody');
      try {
        const res = await fetch(`/api/yield/lands?state=${STATE}`, { headers: authHeaders() });
        const lands = await res.json();

        if (!Array.isArray(lands) || lands.length === 0) {
          updateStats([]);
          tbody.innerHTML = `<tr><td colspan="8" class="yd-empty">No lands analyzed yet for ${STATE_LABEL}. Click "＋ Add Land" to geofence your first plot.</td></tr>`;
          return;
        }

        updateStats(lands);

        tbody.innerHTML = lands.map(land => `
          <tr>
            <td><strong>${escapeHtml(land.property_name || '—')}</strong></td>
            <td>${escapeHtml(land.district || '—')}</td>
            <td>${escapeHtml(land.crop || '—')}</td>
            <td>${fmt(land.area_hectare, 2)}</td>
            <td>${land.predicted_yield !== null && land.predicted_yield !== undefined ? fmt(land.predicted_yield, 3) + ' t/ha' : '—'}</td>
            <td>${anomalyPill(land.anomaly_pct)}</td>
            <td>${land.updated_at ? new Date(land.updated_at).toLocaleDateString() : '—'}</td>
            <td>
              <div class="row-actions">
                ${IS_FARMER ? `<button class="btn btn-small" onclick="goEditLand(${land.id})">✎ Edit</button>` : ''}
                ${CAN_DELETE ? `<button class="btn btn-small btn-danger" onclick="deleteLand(${land.id})">🗑 Delete</button>` : ''}
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="yd-empty">Could not load land records. Is the yield-detect backend running?</td></tr>`;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function deleteLand(id) {
      if (!confirm('Delete this land record? This cannot be undone.')) return;
      try {
        const res = await fetch(`/api/yield/lands/${id}`, { method: 'DELETE', headers: authHeaders() });
        if (!res.ok) throw new Error();
        showToast('Land record deleted');
        loadLands();
      } catch {
        showToast('Failed to delete land record', true);
      }
    }

    loadLands();
  </script>
</body>
</html>
