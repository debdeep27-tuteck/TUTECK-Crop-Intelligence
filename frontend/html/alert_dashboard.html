<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CropAI — Live Alerts &amp; Early Warning System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design_system.css">
  <link rel="stylesheet" href="../css/alert_dashboard.css">
</head>

<body>
  <!-- Header -->
  <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;">
    <div>
      <div class="page-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Live <span class="accent">Alerts</span>
      </div>
      <div class="page-subtitle" id="alert-subtitle">Real-time alerts and notifications for critical agricultural insights &amp; yield anomalies</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn btn-secondary btn-sm" onclick="markAllAsRead()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Mark All as Read
      </button>
    </div>
  </div>

  <!-- Category Filter Tabs -->
  <div class="alert-category-tabs">
    <button class="cat-tab active" onclick="filterCategory('all', this)">All Alerts</button>
    <button class="cat-tab" onclick="filterCategory('Weather', this)">Weather</button>
    <button class="cat-tab" onclick="filterCategory('Disease', this)">Disease</button>
    <button class="cat-tab" onclick="filterCategory('Pest', this)">Pest</button>
    <button class="cat-tab" onclick="filterCategory('Advisory', this)">Advisory</button>
    <button class="cat-tab" onclick="filterCategory('System', this)">System</button>
  </div>

  <!-- Filter Controls -->
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Priority Filter:</span>
      <select class="form-select" id="priority-filter" onchange="applyPriorityFilter()">
        <option value="all">All Priorities</option>
        <option value="High">High Priority Only</option>
        <option value="Medium">Medium Priority Only</option>
        <option value="Low">Low Priority Only</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">District Scope:</span>
      <select class="form-select" id="district-filter" onchange="applyPriorityFilter()"></select>
    </div>
  </div>

  <!-- Alert Rows Feed -->
  <div class="alert-feed" id="alert-feed-container">
    <!-- Rendered dynamically -->
  </div>

  <script src="../js/alert_dashboard.js"></script>
</body>
</html>
