<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CropAI — Intelligence Suite</title>
  <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f5f0;
      --border: #e0ddd5;
      --border2: #c8c4b8;
      --leaf: #4a7c59;
      --text: #1a1a18;
      --text2: #33332e;
      --text3: #8e8e0c;
      --amber: #c9922a;
      --sky: #0ea5e9;
      --mono: 'DM Mono', monospace;
      --head: 'DM Serif Display', serif;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
    }

    /* NAVBAR */
    .global-nav {
      position: sticky;
      top: 0;
      z-index: 300;
      background: rgba(247, 242, 229, 0.97);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }

    /* BRAND (LOGO AREA) */
    .gn-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 32px;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
    }

    /* MENU LINKS */
    .gn-links {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
    }

    .gn-link {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      padding: 6px 14px;
      border-radius: 3px;
      text-decoration: none;
      border: 1px solid transparent;
      transition: all 0.15s;
      cursor: pointer;
      white-space: nowrap;
    }

    .gn-link:hover {
      color: var(--text2);
      border-color: var(--border2);
    }

    .gn-link.active {
      color: var(--leaf);
      border-color: rgba(58, 158, 82, 0.35);
      background: rgba(58, 158, 82, 0.07);
    }

    /* RIGHT SIDE */
    .gn-right {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .gn-pill {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--sky);
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(14, 165, 233, 0.2);
      padding: 3px 9px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .gn-pill.online {
      color: var(--leaf);
      background: rgba(74, 124, 89, 0.08);
      border-color: rgba(74, 124, 89, 0.25);
    }

    .gn-pill.offline {
      color: var(--text3);
    }

    .gn-pill.amber {
      color: var(--amber);
      background: rgba(217, 119, 6, 0.08);
      border-color: rgba(217, 119, 6, 0.2);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--leaf);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .25
      }
    }

    /* CONTENT */
    .page-frame {
      width: 100%;
      height: calc(100vh - 52px);
      border: none;
    }

    /* NAV STATE DROPDOWN - NO POPUP */
    .state-menu {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .gn-state-btn {
      min-width: 128px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--leaf);
      background: rgba(74, 124, 89, 0.07);
      border: 1px solid rgba(74, 124, 89, 0.30);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .gn-state-btn:hover,
    .state-menu.open .gn-state-btn {
      background: rgba(74, 124, 89, 0.14);
      border-color: rgba(74, 124, 89, 0.45);
    }

    .gn-state-btn.locked {
      cursor: default;
      opacity: 0.75;
    }
    .gn-state-btn.locked:hover {
      background: rgba(74, 124, 89, 0.07);
      border-color: rgba(74, 124, 89, 0.30);
    }

    .state-caret {
      color: var(--text2);
      font-size: 10px;
      line-height: 1;
      transition: transform 0.15s;
    }

    .state-menu.open .state-caret {
      transform: rotate(180deg);
    }

    .state-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 184px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.12);
      padding: 7px;
      display: none;
      z-index: 500;
    }

    .state-menu.open .state-dropdown {
      display: block;
    }

    .state-dropdown::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 22px;
      width: 14px;
      height: 14px;
      background: rgba(255, 255, 255, 0.96);
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
      transform: rotate(45deg);
    }

    .state-option {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text2);
      border-radius: 5px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
    }

    .state-option:hover {
      background: rgba(74, 124, 89, 0.07);
      color: var(--leaf);
    }

    .state-option.active {
      background: rgba(74, 124, 89, 0.13);
      color: var(--leaf);
    }

    .state-check {
      opacity: 0;
      color: var(--leaf);
      font-size: 11px;
    }

    .state-option.active .state-check {
      opacity: 1;
    }

    /* PROFILE AVATAR + DROPDOWN */
    .profile-menu {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .profile-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--leaf);
      color: #fff;
      border: 1px solid rgba(74, 124, 89, 0.4);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: box-shadow 0.15s, transform 0.1s;
    }

    .profile-avatar:hover {
      box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
    }

    .profile-avatar:active {
      transform: scale(0.96);
    }

    .profile-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 168px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.12);
      padding: 6px;
      display: none;
      z-index: 500;
    }

    /* Shows on hover of the whole menu, OR when explicitly opened via click */
    .profile-menu:hover .profile-dropdown,
    .profile-menu.open .profile-dropdown {
      display: block;
    }

    .profile-dropdown::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 10px;
      width: 14px;
      height: 14px;
      background: rgba(255, 255, 255, 0.97);
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
      transform: rotate(45deg);
    }

    .profile-dropdown-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text2);
      border-radius: 5px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
    }

    .profile-dropdown-item:hover {
      background: rgba(74, 124, 89, 0.07);
      color: var(--leaf);
    }

    .profile-dropdown-item.danger:hover {
      background: rgba(192, 57, 43, 0.08);
      color: #c0392b;
    }

    /* PROFILE CARD (shown on clicking "Profile") */
    .profile-card-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 900;
    }

    .profile-card-overlay.show {
      display: flex;
    }

    .profile-card {
      width: 260px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
      padding: 28px 24px 22px;
      text-align: center;
      position: relative;
    }

    .profile-card-close {
      position: absolute;
      top: 10px;
      right: 12px;
      border: none;
      background: transparent;
      color: var(--text3);
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }

    .profile-card-close:hover {
      color: var(--text2);
    }

    .profile-card-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--leaf);
      color: #fff;
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .profile-card-name {
      font-family: var(--head);
      font-size: 18px;
      color: var(--text);
      margin-bottom: 4px;
      word-break: break-word;
    }

    .profile-card-email {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text3);
      letter-spacing: 0.03em;
      margin-bottom: 14px;
      word-break: break-all;
    }

    .profile-card-role {
      display: inline-block;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--leaf);
      background: rgba(74, 124, 89, 0.08);
      border: 1px solid rgba(74, 124, 89, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
    }

    @media (max-width: 980px) {
      .global-nav {
        padding: 0 12px;
        gap: 8px;
      }

      .gn-brand {
        margin-right: 10px;
      }

      .gn-link {
        padding: 6px 8px;
        font-size: 9px;
      }

      .gn-right {
        gap: 7px;
      }

      .gn-pill {
        display: none;
      }

      .gn-state-btn {
        min-width: 112px;
      }
    }

    .crop-title {
      font-family: var(--head);
      font-size: 18px;
      color: var(--leaf);
      letter-spacing: 0.5px;
      margin-left: 0px;
      margin-right: 50px;
    }

    .gn-links {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      margin-left: 3px;
    }
  </style>
</head>

<body>
  <nav class="global-nav">
    <div class="gn-brand">
      <img src="/static/tuteck_logo.png" alt="Logo" class="brand-logo">
    </div>
    <div class="crop-title">Crop Intelligence</div>

    <div class="gn-links">
      <a class="gn-link" data-target="/dashboard" data-content="/content/dashboard" href="#">📊 Dashboard</a>
      <a class="gn-link" data-target="/irrigation" data-content="/content/irrigation" href="#">💧 Irrigation</a>
      <a class="gn-link" data-target="/recommend-page" data-content="/content/recommender" href="#">🌱 Recommender</a>
      <a class="gn-link" data-target="/alerts" data-content="/content/alerts" href="#">⚠️ Alerts (EWAS)</a>
      <a class="gn-link" data-target="/disease" data-content="/content/disease" href="#">🔬 Disease Detection</a>
      <a class="gn-link" data-target="/yield-detect" data-content="/content/yield-detect" href="#">🛰️ Yield Detect</a>
      <a class="gn-link" data-target="/auction" data-content="/content/auction" href="#"> 📈 Auction</a>
    </div>

    <div class="gn-right">
      <div class="live-dot"></div>

      <div class="state-menu" id="state-menu">
        <button class="gn-state-btn" id="state-switcher" type="button" onclick="toggleStateMenu(event)">
          <span id="state-label">🌏 Tripura</span>
          <span class="state-caret">⌃</span>
        </button>
        <div class="state-dropdown" id="state-dropdown">
          <button class="state-option" type="button" data-state="tripura" onclick="selectState('tripura')">
            <span>Tripura</span>
            <span class="state-check">✓</span>
          </button>
          <button class="state-option" type="button" data-state="meghalaya" onclick="selectState('meghalaya')">
            <span>Meghalaya</span>
            <span class="state-check">✓</span>
          </button>
          <button class="state-option" type="button" data-state="rajasthan" onclick="selectState('rajasthan')">
            <span>Rajasthan</span>
            <span class="state-check">✓</span>
          </button>
        </div>
      </div>

      <div class="gn-pill offline" id="backend-status">BACKEND OFFLINE</div>
      <div class="gn-pill amber" id="alerts-status">ALERTS —</div>

      <div class="profile-menu" id="profile-menu">
        <button class="profile-avatar" id="profile-avatar" type="button" onclick="toggleProfileMenu(event)">?</button>
        <div class="profile-dropdown" id="profile-dropdown">

          <button class="profile-dropdown-item" type="button" onclick="openProfileCard(event)">
            👤 Profile
          </button>

          <button id="admin-panel-btn" class="profile-dropdown-item" type="button" onclick="goToAdmin()"
            style="display:none;">
            ⚙️ Admin Panel
          </button>

          <button class="profile-dropdown-item danger" type="button" onclick="logout()">
            ⎋ Logout
          </button>

        </div>
      </div>
    </div>
  </nav>

  <div class="profile-card-overlay" id="profile-card-overlay" onclick="closeProfileCardOnOverlay(event)">
    <div class="profile-card">
      <button class="profile-card-close" type="button" onclick="closeProfileCard()">✕</button>
      <div class="profile-card-avatar" id="profile-card-avatar">?</div>
      <div class="profile-card-name" id="profile-card-name">—</div>
      <div class="profile-card-email" id="profile-card-email">—</div>
      <div class="profile-card-role" id="profile-card-role">—</div>
    </div>
  </div>

  <iframe class="page-frame" id="page-frame" src="/content/dashboard"></iframe>

  <script>
    // ── AUTH GUARD ───────────────────────────────────────────────────────
    const SESSION_KEY = 'cropai_session';

    function getSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
      catch { return null; }
    }

    const session = getSession();
    if (!session || !session.token) {
      window.location.href = '/login';
    }
    function goToAdmin() {
      window.location.href = "/admin";
    }
    // Live permission set for this session — fetched from the backend below
    // (which reads permissions.xlsx), NOT hardcoded, so admin changes to a
    // role's allowed pages take effect immediately on next login/page load.
    let ALLOWED_PAGES = [];

    async function fetchMyPermissions() {
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': 'Bearer ' + session.token },
        });
        if (res.status === 401) {
          // Session token is invalid/expired — force a fresh login.
          localStorage.removeItem(SESSION_KEY);
          window.location.href = '/login';
          return [];
        }
        const data = await res.json();
        return (data.permissions && data.permissions.pages) || [];
      } catch {
        // Backend unreachable — fail closed (no pages) rather than trusting stale data.
        return [];
      }
    }

    function applyRoleAccess() {
      if (!session) return;
      document.querySelectorAll('.gn-link[data-target]').forEach(link => {
        if (!ALLOWED_PAGES.includes(link.dataset.target)) {
          link.style.display = 'none';
        }
      });
    }

    async function logout() {
      try {
        if (session && session.token) {
          await fetch('/api/auth/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: session.token }),
          });
        }
      } catch { }
      localStorage.removeItem(SESSION_KEY);
      window.location.href = '/login';
    }

    // ── PROFILE WIDGET ─────────────────────────────────────────────────────
    // Username is derived from the email (the part before "@"), truncated
    // if it's long, since we don't collect a separate display name at signup.

    function usernameFromEmail(email) {
      if (!email) return 'User';
      const local = email.split('@')[0];
      return local.length > 18 ? local.slice(0, 18) + '…' : local;
    }

    function initialsFromEmail(email) {
      if (!email) return '?';
      return email.trim().charAt(0).toUpperCase();
    }

    function applyProfileInfo() {
      if (!session) return;

      const initial = initialsFromEmail(session.email);
      const name = usernameFromEmail(session.email);
      const role =
        (session.role || '').charAt(0).toUpperCase() +
        (session.role || '').slice(1);

      document.getElementById('profile-avatar').textContent = initial;
      document.getElementById('profile-card-avatar').textContent = initial;
      document.getElementById('profile-card-name').textContent = name;
      document.getElementById('profile-card-email').textContent = session.email;
      document.getElementById('profile-card-role').textContent = role;

      const adminBtn = document.getElementById('admin-panel-btn');

      if (session.role === 'admin') {
        adminBtn.style.display = 'flex';
      } else {
        adminBtn.style.display = 'none';
      }
    }

    function toggleProfileMenu(event) {
      event.stopPropagation();
      document.getElementById('profile-menu').classList.toggle('open');
    }

    function closeProfileMenu() {
      document.getElementById('profile-menu').classList.remove('open');
    }

    function openProfileCard(event) {
      event.stopPropagation();
      closeProfileMenu();
      document.getElementById('profile-card-overlay').classList.add('show');
    }

    function closeProfileCard() {
      document.getElementById('profile-card-overlay').classList.remove('show');
    }

    function closeProfileCardOnOverlay(event) {
      // Only close if the click landed on the dark backdrop, not the card itself.
      if (event.target.id === 'profile-card-overlay') closeProfileCard();
    }

    window.addEventListener('click', closeProfileMenu);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeProfileMenu();
        closeProfileCard();
      }
    });

    const profileDropdown = document.getElementById('profile-dropdown');
    if (profileDropdown) {
      profileDropdown.addEventListener('click', (event) => event.stopPropagation());
    }

    applyProfileInfo();

    const links = document.querySelectorAll('.gn-link');
    const frame = document.getElementById('page-frame');
    const routeMap = {};

    links.forEach(link => {
      routeMap[link.dataset.target] = link.dataset.content;
    });

    function setActive(path) {
      links.forEach(link => {
        link.classList.toggle('active', link.dataset.target === path);
      });
    }

    links.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const target = link.dataset.target;
        frame.src = link.dataset.content + stateParam();
        setActive(target);
        history.replaceState(null, '', target);
        closeStateMenu();
      });
    });

    // ── STATE MANAGEMENT ──────────────────────────────────────────────────
    const STATES = ['tripura', 'meghalaya', 'rajasthan'];
    const STATE_LABELS = {
      tripura: 'Tripura',
      meghalaya: 'Meghalaya',
      rajasthan: 'Rajasthan',
    };

    // district_admin AND state_admin accounts are pinned to the single
    // state they were assigned in the admin panel — neither gets to pick
    // a different state. district_admin is additionally pinned to one
    // district within that state.
    const IS_DISTRICT_ADMIN = !!(session && (session.role || '').toLowerCase() === 'district_admin');
    const IS_STATE_ADMIN = !!(session && (session.role || '').toLowerCase() === 'state_admin');
    const IS_STATE_LOCKED = IS_DISTRICT_ADMIN || IS_STATE_ADMIN;
    const ASSIGNED_STATE = IS_STATE_LOCKED ? (session.state || '').toLowerCase() : null;

    function getCurrentState() {
      if (IS_STATE_LOCKED && ASSIGNED_STATE) {
        return STATES.includes(ASSIGNED_STATE) ? ASSIGNED_STATE : 'tripura';
      }
      const saved = (localStorage.getItem('cropai_state') || 'tripura').toLowerCase();
      return STATES.includes(saved) ? saved : 'tripura';
    }

    function stateParam() {
      const state = getCurrentState();
      let param = `?state=${encodeURIComponent(state)}`;
      // Let content pages (dashboard, yield-detect, etc.) scope their own
      // queries to this district without each one re-deriving it from the
      // session — the page's own script still needs to honour it.
      if (IS_DISTRICT_ADMIN && session.district) {
        param += `&district=${encodeURIComponent(session.district)}`;
      }
      return param;
    }

    function toggleStateMenu(event) {
      if (IS_STATE_LOCKED) return; // no picker to open
      event.stopPropagation();
      document.getElementById('state-menu').classList.toggle('open');
    }

    function closeStateMenu() {
      document.getElementById('state-menu').classList.remove('open');
    }

    function selectState(state) {
      if (IS_STATE_LOCKED) return; // locked to their assigned state
      state = String(state || 'tripura').toLowerCase();
      if (!STATES.includes(state)) state = 'tripura';
      localStorage.setItem('cropai_state', state);
      updateStatePill(state);
      closeStateMenu();
      loadCurrentPage();
    }

    function updateStatePill(state) {
      const label = state.charAt(0).toUpperCase() + state.slice(1);
      document.getElementById('state-label').textContent = '🌏 ' + label;

      document.querySelectorAll('.state-option').forEach(option => {
        option.classList.toggle('active', option.dataset.state === state);
      });

      // Keep the pill visible for district_admin/state_admin so they can
      // still see which state they're scoped to — just lock it so it
      // can't be clicked open (toggleStateMenu already blocks this).
      const switcher = document.getElementById('state-switcher');
      if (switcher) {
        switcher.classList.toggle('locked', IS_STATE_LOCKED);
        switcher.disabled = IS_STATE_LOCKED;
        switcher.title = IS_STATE_LOCKED ? 'Locked to your assigned state' : '';
      }
      const caret = document.querySelector('#state-switcher .state-caret');
      if (caret) caret.style.display = IS_STATE_LOCKED ? 'none' : '';
    }

    function loadCurrentPage() {
      let currentPath = window.location.pathname;

      // If the current path isn't allowed for this role, fall back to the
      // first page that role IS allowed to see (farmers have no /dashboard).
      if (session) {
        if (!ALLOWED_PAGES.includes(currentPath)) {
          currentPath = ALLOWED_PAGES[0] || '/dashboard';
          history.replaceState(null, '', currentPath);
        }
      }

      const content = routeMap[currentPath] || '/content/dashboard';
      frame.src = content + stateParam();
      setActive(routeMap[currentPath] ? currentPath : '/dashboard');
    }

    // Close dropdown when clicking outside or pressing Escape
    window.addEventListener('click', closeStateMenu);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeStateMenu();
    });

    // Prevent dropdown clicks from bubbling to window
    const stateDropdown = document.getElementById('state-dropdown');
    stateDropdown.addEventListener('click', (event) => event.stopPropagation());

    // ── BOOT ─────────────────────────────────────────────────────────────
    (async function boot() {
      const savedState = getCurrentState();
      localStorage.setItem('cropai_state', savedState);
      updateStatePill(savedState);

      ALLOWED_PAGES = await fetchMyPermissions();

      applyRoleAccess();
      loadCurrentPage();
    })();

    // ── BACKEND HEALTH CHECK ──────────────────────────────────────────────
    async function checkBackend() {
      const pill = document.getElementById('backend-status');
      try {
        const res = await fetch('/health', { cache: 'no-store' });
        if (res.ok) {
          pill.textContent = 'BACKEND ONLINE';
          pill.classList.remove('offline');
          pill.classList.add('online');
        } else throw new Error();
      } catch {
        pill.textContent = 'BACKEND OFFLINE';
        pill.classList.remove('online');
        pill.classList.add('offline');
      }
    }

    checkBackend();
    setInterval(checkBackend, 15000);
  </script>
</body>
