<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CropAI &#8212; Intelligence Suite</title>
  <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --border2: #cbd5e1;
      --leaf: #059669;
      --leaf-dark: #047857;
      --text: #0f172a;
      --text2: #1e293b;
      --text3: #64748b;
      --amber: #d97706;
      --sky: #0284c7;
      --mono: 'DM Mono', monospace;
      --head: 'DM Serif Display', serif;
      --sidebar-width: 240px;
      --sidebar-collapsed-width: 68px;
      --header-height: 60px;
    }

    body {
      height: 100%;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }

    /* â”€â”€ APP SHELL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .app-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* â”€â”€ SIDEBAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .sidebar {
      width: var(--sidebar-width);
      background: #ffffff;
      border-right: 1px solid var(--border);
      box-shadow: 1px 0 2px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 400;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.04);
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }

    /* Sidebar brand row */
    .sidebar-header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
      white-space: nowrap;
      background: var(--bg);
    }

    .sidebar.collapsed .sidebar-header {
      padding: 0;
      justify-content: center;
    }

    .brand-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .sidebar-brand-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      white-space: nowrap;
      transition: opacity 0.2s, width 0.28s;
    }

    .sidebar.collapsed .sidebar-brand-text {
      opacity: 0;
      width: 0;
    }

    .brand-name {
      font-family: var(--head);
      font-size: 16px;
      color: var(--leaf);
      line-height: 1.1;
    }

    .brand-sub {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text3);
      text-transform: uppercase;
      margin-top: 1px;
    }

    /* Nav links */
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 14px 10px;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar-nav::-webkit-scrollbar { width: 3px; }
    .sidebar-nav::-webkit-scrollbar-track { background: var(--bg); }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    .gn-link {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--mono);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text2);
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.18s ease;
      white-space: nowrap;
      border: 1px solid transparent;
      position: relative;
    }

    .sidebar.collapsed .gn-link {
      padding: 10px 0;
      justify-content: center;
      gap: 0;
    }

    .gn-link .nav-icon {
      font-size: 17px;
      flex-shrink: 0;
      width: 22px;
      text-align: center;
      line-height: 1;
    }

    .gn-link .nav-label {
      transition: opacity 0.18s, width 0.28s;
      overflow: hidden;
      white-space: nowrap;
    }

    .sidebar.collapsed .gn-link .nav-label {
      opacity: 0;
      width: 0;
    }

    .gn-link:hover {
      background: rgba(74, 124, 89, 0.07);
      color: var(--leaf);
      border-color: rgba(74, 124, 89, 0.12);
    }

    .gn-link.active {
      background: rgba(74, 124, 89, 0.11);
      color: var(--leaf-dark);
      border-color: rgba(74, 124, 89, 0.22);
      font-weight: 600;
    }

    .gn-link.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 3px;
      background: var(--leaf);
      border-radius: 0 3px 3px 0;
    }

    .sidebar.collapsed .gn-link.active::before {
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 0 3px 3px 0;
    }

    /* Sidebar section divider */
    .nav-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 6px;
    }

    /* Sidebar footer */
    .sidebar-footer {
      padding: 10px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-footer-text {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--border2);
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
      padding: 4px;
      transition: opacity 0.2s;
    }

    .sidebar.collapsed .sidebar-footer-text { opacity: 0; }

    /* â”€â”€ MAIN CONTENT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: rgba(255, 255, 255, 0.2);
    }

    /* ── TOP HEADER ────────────────────────────────────────────────── */
    .top-header {
      height: var(--header-height);
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 300;
      flex-shrink: 0;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Hamburger toggle */
    .toggle-sidebar-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 34px;
      height: 34px;
      border-radius: 7px;
      transition: all 0.18s;
      padding: 0;
      flex-shrink: 0;
    }

    .toggle-sidebar-btn:hover {
      background: rgba(74, 124, 89, 0.06);
      border-color: rgba(74, 124, 89, 0.25);
      color: var(--leaf);
    }

    .ham-line {
      width: 16px;
      height: 1.5px;
      background: currentColor;
      border-radius: 2px;
      transition: all 0.18s;
    }

    /* Page breadcrumb */
    .header-breadcrumb {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-breadcrumb .sep {
      opacity: 0.4;
    }

    /* Right controls */
    .gn-right {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--leaf);
      text-transform: uppercase;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--leaf);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74, 124, 89, 0.4); }
      50% { opacity: 0.4; box-shadow: 0 0 0 4px rgba(74, 124, 89, 0); }
    }

    /* Pills */
    .gn-pill {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 5px;
      white-space: nowrap;
      font-weight: 500;
      border: 1px solid;
    }

    .gn-pill.online {
      color: var(--leaf);
      background: rgba(74, 124, 89, 0.07);
      border-color: rgba(74, 124, 89, 0.2);
    }

    .gn-pill.offline {
      color: #888;
      background: rgba(0,0,0,0.03);
      border-color: rgba(0,0,0,0.1);
    }

    .gn-pill.amber {
      color: var(--amber);
      background: rgba(217, 119, 6, 0.07);
      border-color: rgba(217, 119, 6, 0.2);
    }

    /* â”€â”€ STATE SWITCHER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .state-menu {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .gn-state-btn {
      min-width: 120px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--leaf);
      background: rgba(74, 124, 89, 0.06);
      border: 1px solid rgba(74, 124, 89, 0.25);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .gn-state-btn:hover,
    .state-menu.open .gn-state-btn {
      background: rgba(74, 124, 89, 0.12);
      border-color: rgba(74, 124, 89, 0.4);
    }

    .gn-state-btn.locked {
      cursor: default;
      opacity: 0.75;
    }

    .gn-state-btn.locked:hover {
      background: rgba(74, 124, 89, 0.06);
      border-color: rgba(74, 124, 89, 0.25);
    }

    .state-caret {
      color: var(--text2);
      font-size: 9px;
      transition: transform 0.15s;
    }

    .state-menu.open .state-caret {
      transform: rotate(180deg);
    }

    .state-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 176px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
      padding: 6px;
      display: none;
      z-index: 500;
    }

    .state-menu.open .state-dropdown {
      display: block;
    }

    .state-dropdown::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 18px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
      transform: rotate(45deg);
    }

    .state-option {
      width: 100%;
      border: none;
      background: var(--bg);
      color: var(--text2);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s;
    }

    .state-option:hover {
      background: rgba(74, 124, 89, 0.06);
      color: var(--leaf);
    }

    .state-option.active {
      background: rgba(74, 124, 89, 0.1);
      color: var(--leaf);
    }

    .state-check {
      opacity: 0;
      color: var(--leaf);
      font-size: 11px;
    }

    .state-option.active .state-check {
      opacity: 1;
    }

    /* â”€â”€ PROFILE WIDGET â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .profile-menu {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--leaf) 0%, var(--leaf-dark) 100%);
      color: #fff;
      border: 2px solid rgba(74, 124, 89, 0.2);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: box-shadow 0.15s, transform 0.1s;
    }

    .profile-avatar:hover {
      box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
    }

    .profile-avatar:active {
      transform: scale(0.95);
    }

    .profile-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 10px);
      width: 172px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
      padding: 6px;
      display: none;
      z-index: 500;
    }

    .profile-menu:hover .profile-dropdown,
    .profile-menu.open .profile-dropdown {
      display: block;
    }

    .profile-dropdown::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 10px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
      transform: rotate(45deg);
    }

    .profile-dropdown-item {
      width: 100%;
      border: none;
      background: var(--bg);
      color: var(--text2);
      border-radius: 6px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s;
    }

    .profile-dropdown-item:hover {
      background: rgba(74, 124, 89, 0.07);
      color: var(--leaf);
    }

    .profile-dropdown-item.danger:hover {
      background: rgba(192, 57, 43, 0.07);
      color: #c0392b;
    }

    /* â”€â”€ PROFILE CARD â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .profile-card-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 900;
      backdrop-filter: blur(4px);
    }

    .profile-card-overlay.show {
      display: flex;
    }

    .profile-card {
      width: 260px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.16);
      padding: 28px 24px 22px;
      text-align: center;
      position: relative;
    }

    .profile-card-close {
      position: absolute;
      top: 10px;
      right: 12px;
      border: none;
      background: var(--bg);
      color: var(--text3);
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }

    .profile-card-close:hover {
      color: var(--text2);
    }

    .profile-card-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--leaf) 0%, var(--leaf-dark) 100%);
      color: #fff;
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }

    .profile-card-name {
      font-family: var(--head);
      font-size: 18px;
      color: var(--text);
      margin-bottom: 4px;
      word-break: break-word;
    }

    .profile-card-email {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text3);
      letter-spacing: 0.03em;
      margin-bottom: 14px;
      word-break: break-all;
    }

    .profile-card-role {
      display: inline-block;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--leaf);
      background: rgba(74, 124, 89, 0.08);
      border: 1px solid rgba(74, 124, 89, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* â”€â”€ IFRAME â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    .page-frame {
      width: 100%;
      height: calc(100vh - var(--header-height));
      border: none;
      background: var(--bg);
    }

    /* â”€â”€ RESPONSIVE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    @media (max-width: 980px) {
      .sidebar {
        position: absolute;
        height: 100%;
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .sidebar.collapsed {
        transform: translateX(calc(-1 * var(--sidebar-width)));
        width: var(--sidebar-width);
      }
      .top-header { padding: 0 14px; }
      .gn-pill { display: none; }
      .live-indicator span { display: none; }
      .header-breadcrumb { display: none; }
    }
  </style>
</head>

<body>
  <div class="app-layout">

    <!-- â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• SIDEBAR â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="/static/tuteck_logo.png" alt="TuTeck Logo" class="brand-logo">
        <div class="sidebar-brand-text">
          <div class="brand-name">Crop Intelligence</div>
          <div class="brand-sub">AI-Powered Platform</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <a class="gn-link" data-target="/dashboard" data-content="/content/dashboard" href="#" title="Dashboard">
          <span class="nav-icon">&#128202;</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a class="gn-link" data-target="/irrigation" data-content="/content/irrigation" href="#" title="Irrigation">
          <span class="nav-icon">&#128167;</span>
          <span class="nav-label">Irrigation</span>
        </a>
        <a class="gn-link" data-target="/recommend-page" data-content="/content/recommender" href="#" title="Recommender">
          <span class="nav-icon">&#127807;</span>
          <span class="nav-label">Recommender</span>
        </a>
        <a class="gn-link" data-target="/alerts" data-content="/content/alerts" href="#" title="Alerts">
          <span class="nav-icon">&#9888;</span>
          <span class="nav-label">Alerts (EWAS)</span>
        </a>

        <div class="nav-divider"></div>

        <a class="gn-link" data-target="/disease" data-content="/content/disease" href="#" title="Disease Detection">
          <span class="nav-icon">&#128300;</span>
          <span class="nav-label">Disease Detection</span>
        </a>
        <a class="gn-link" data-target="/yield-detect" data-content="/content/yield-detect" href="#" title="Yield Detect">
          <span class="nav-icon">&#128752;</span>

        </a>

          <span class="nav-icon">&#128200;</span>

        </a>
        <a class="gn-link" data-target="/cold-storage" data-content="/content/cold-storage" href="#" title="Cold Storage">
          <span class="nav-icon">&#10052;</span>

      <div class="sidebar-footer">
        <div class="sidebar-footer-text">TuTeck &copy; 2026</div>

    </aside>

    <!-- â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• MAIN â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
    <main class="main-content">

      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <button class="toggle-sidebar-btn" id="toggle-sidebar" onclick="toggleSidebar()" title="Toggle Sidebar">
            <div class="ham-line"></div>
            <div class="ham-line"></div>
            <div class="ham-line"></div>
          </button>
          <div class="header-breadcrumb">
            <span>Crop Intelligence</span>
            <span class="sep">/</span>
            <span id="breadcrumb-page">Dashboard</span>
          </div>
        </div>

        <div class="gn-right">
          <div class="live-indicator">
            <div class="live-dot"></div>
            <span>Live</span>
          </div>

          <!-- State Switcher -->
          <div class="state-menu" id="state-menu">
            <button class="gn-state-btn" id="state-switcher" type="button" onclick="toggleStateMenu(event)">
              <span id="state-label">Tripura</span>
              <span class="state-caret">&#9650;</span>
            </button>
            <div class="state-dropdown" id="state-dropdown">
              <button class="state-option" type="button" data-state="tripura" onclick="selectState('tripura')">
                <span>Tripura</span>
                <span class="state-check">&#10003;</span>
              </button>
              <button class="state-option" type="button" data-state="meghalaya" onclick="selectState('meghalaya')">
                <span>Meghalaya</span>
                <span class="state-check">&#10003;</span>
              </button>
              <button class="state-option" type="button" data-state="rajasthan" onclick="selectState('rajasthan')">
                <span>Rajasthan</span>
                <span class="state-check">&#10003;</span>
              </button>
            </div>
          </div>

          <div class="gn-pill offline" id="backend-status">BACKEND OFFLINE</div>
          <div class="gn-pill amber" id="alerts-status">ALERTS &#8212;</div>

          <!-- Profile -->
          <div class="profile-menu" id="profile-menu">
            <button class="profile-avatar" id="profile-avatar" type="button" onclick="toggleProfileMenu(event)">?</button>
            <div class="profile-dropdown" id="profile-dropdown">
              <button class="profile-dropdown-item" type="button" onclick="openProfileCard(event)">
                &#128100; Profile
              </button>
              <button id="admin-panel-btn" class="profile-dropdown-item" type="button" onclick="goToAdmin()"
                style="display:none;">
                &#9881; Admin Panel
              </button>
              <button class="profile-dropdown-item danger" type="button" onclick="logout()">
                &#9243; Logout
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Profile Card Overlay -->
      <div class="profile-card-overlay" id="profile-card-overlay" onclick="closeProfileCardOnOverlay(event)">
        <div class="profile-card">
          <button class="profile-card-close" type="button" onclick="closeProfileCard()">&#10005;</button>
          <div class="profile-card-avatar" id="profile-card-avatar">?</div>
          <div class="profile-card-name" id="profile-card-name">&#8212;</div>
          <div class="profile-card-email" id="profile-card-email">&#8212;</div>
          <div class="profile-card-role" id="profile-card-role">&#8212;</div>
        </div>
      </div>

      <iframe class="page-frame" id="page-frame" src="/content/dashboard"></iframe>
    </main>
  </div>

  <script>
    // â”€â”€ SIDEBAR TOGGLE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    // â”€â”€ AUTH GUARD â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const SESSION_KEY = 'cropai_session';

    function getSession() {
      try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
      catch { return null; }
    }

    const session = getSession();
    if (!session || !session.token) {
      window.location.href = '/login';
    }

    function goToAdmin() {
      window.location.href = "/admin";
    }

    // Live permission set for this session - fetched from the backend below
    let ALLOWED_PAGES = [];

    async function fetchMyPermissions() {
      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': 'Bearer ' + session.token },
        });
        if (res.status === 401) {
          localStorage.removeItem(SESSION_KEY);
          window.location.href = '/login';
          return [];
        }
        const data = await res.json();
        return (data.permissions && data.permissions.pages) || [];
      } catch {
        return [];
      }
    }

    function applyRoleAccess() {
      if (!session) return;
      document.querySelectorAll('.gn-link[data-target]').forEach(link => {
        if (!ALLOWED_PAGES.includes(link.dataset.target)) {
          link.style.display = 'none';
        }
      });
    }

    async function logout() {
      try {
        if (session && session.token) {
          await fetch('/api/auth/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: session.token }),
          });
        }
      } catch { }
      localStorage.removeItem(SESSION_KEY);
      window.location.href = '/login';
    }

    // â”€â”€ PROFILE WIDGET â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function usernameFromEmail(email) {
      if (!email) return 'User';
      const local = email.split('@')[0];
      return local.length > 18 ? local.slice(0, 18) + '...' : local;
    }

    function initialsFromEmail(email) {
      if (!email) return '?';
      return email.trim().charAt(0).toUpperCase();
    }

    function applyProfileInfo() {
      if (!session) return;

      const initial = initialsFromEmail(session.email);
      const name = usernameFromEmail(session.email);
      const role =
        (session.role || '').charAt(0).toUpperCase() +
        (session.role || '').slice(1);

      document.getElementById('profile-avatar').textContent = initial;
      document.getElementById('profile-card-avatar').textContent = initial;
      document.getElementById('profile-card-name').textContent = name;
      document.getElementById('profile-card-email').textContent = session.email;
      document.getElementById('profile-card-role').textContent = role;

      const adminBtn = document.getElementById('admin-panel-btn');
      if (session.role === 'admin') {
        adminBtn.style.display = 'flex';
      } else {
        adminBtn.style.display = 'none';
      }
    }

    function toggleProfileMenu(event) {
      event.stopPropagation();
      document.getElementById('profile-menu').classList.toggle('open');
    }

    function closeProfileMenu() {
      document.getElementById('profile-menu').classList.remove('open');
    }

    function openProfileCard(event) {
      event.stopPropagation();
      closeProfileMenu();
      document.getElementById('profile-card-overlay').classList.add('show');
    }

    function closeProfileCard() {
      document.getElementById('profile-card-overlay').classList.remove('show');
    }

    function closeProfileCardOnOverlay(event) {
      if (event.target.id === 'profile-card-overlay') closeProfileCard();
    }

    window.addEventListener('click', closeProfileMenu);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeProfileMenu();
        closeProfileCard();
      }
    });

    const profileDropdown = document.getElementById('profile-dropdown');
    if (profileDropdown) {
      profileDropdown.addEventListener('click', (event) => event.stopPropagation());
    }

    applyProfileInfo();

    // â”€â”€ ROUTING â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const links = document.querySelectorAll('.gn-link');
    const frame = document.getElementById('page-frame');
    const routeMap = {};

    const pageTitles = {
      '/dashboard': 'Dashboard',
      '/irrigation': 'Irrigation',
      '/recommend-page': 'Recommender',
      '/alerts': 'Alerts',
      '/disease': 'Disease Detection',
      '/yield-detect': 'Yield Detect',
      '/auction': 'Auction',
      '/cold-storage': 'Cold Storage',
    };

    links.forEach(link => {
      routeMap[link.dataset.target] = link.dataset.content;
    });

    function setActive(path) {
      links.forEach(link => {
        link.classList.toggle('active', link.dataset.target === path);
      });
      const bc = document.getElementById('breadcrumb-page');
      if (bc) bc.textContent = pageTitles[path] || 'Dashboard';
    }

    links.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const target = link.dataset.target;
        frame.src = link.dataset.content + stateParam();
        setActive(target);
        history.replaceState(null, '', target);
        closeStateMenu();
      });
    });

    // â”€â”€ STATE MANAGEMENT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const STATES = ['tripura', 'meghalaya', 'rajasthan'];
    const STATE_LABELS = {
      tripura: 'Tripura',
      meghalaya: 'Meghalaya',
      rajasthan: 'Rajasthan',
    };

    const IS_DISTRICT_ADMIN = !!(session && (session.role || '').toLowerCase() === 'district_admin');
    const IS_STATE_ADMIN = !!(session && (session.role || '').toLowerCase() === 'state_admin');
    const IS_STATE_LOCKED = IS_DISTRICT_ADMIN || IS_STATE_ADMIN;
    const ASSIGNED_STATE = IS_STATE_LOCKED ? (session.state || '').toLowerCase() : null;

    function getCurrentState() {
      if (IS_STATE_LOCKED && ASSIGNED_STATE) {
        return STATES.includes(ASSIGNED_STATE) ? ASSIGNED_STATE : 'tripura';
      }
      const saved = (localStorage.getItem('cropai_state') || 'tripura').toLowerCase();
      return STATES.includes(saved) ? saved : 'tripura';
    }

    function stateParam() {
      const state = getCurrentState();
      let param = `?state=${encodeURIComponent(state)}`;
      if (IS_DISTRICT_ADMIN && session.district) {
        param += `&district=${encodeURIComponent(session.district)}`;
      }
      return param;
    }

    function toggleStateMenu(event) {
      if (IS_STATE_LOCKED) return;
      event.stopPropagation();
      document.getElementById('state-menu').classList.toggle('open');
    }

    function closeStateMenu() {
      document.getElementById('state-menu').classList.remove('open');
    }

    function selectState(state) {
      if (IS_STATE_LOCKED) return;
      state = String(state || 'tripura').toLowerCase();
      if (!STATES.includes(state)) state = 'tripura';
      localStorage.setItem('cropai_state', state);
      updateStatePill(state);
      closeStateMenu();
      loadCurrentPage();
    }

    function updateStatePill(state) {
      const label = STATE_LABELS[state] || (state.charAt(0).toUpperCase() + state.slice(1));
      document.getElementById('state-label').textContent = label;

      document.querySelectorAll('.state-option').forEach(option => {
        option.classList.toggle('active', option.dataset.state === state);
      });

      const switcher = document.getElementById('state-switcher');
      if (switcher) {
        switcher.classList.toggle('locked', IS_STATE_LOCKED);
        switcher.disabled = IS_STATE_LOCKED;
        switcher.title = IS_STATE_LOCKED ? 'Locked to your assigned state' : '';
      }
      const caret = document.querySelector('#state-switcher .state-caret');
      if (caret) caret.style.display = IS_STATE_LOCKED ? 'none' : '';
    }

    function loadCurrentPage() {
      let currentPath = window.location.pathname;

      if (session) {
        if (!ALLOWED_PAGES.includes(currentPath)) {
          currentPath = ALLOWED_PAGES[0] || '/dashboard';
          history.replaceState(null, '', currentPath);
        }
      }

      const content = routeMap[currentPath] || '/content/dashboard';
      frame.src = content + stateParam();
      setActive(routeMap[currentPath] ? currentPath : '/dashboard');
    }

    window.addEventListener('click', closeStateMenu);
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeStateMenu();
    });

    const stateDropdown = document.getElementById('state-dropdown');
    stateDropdown.addEventListener('click', (event) => event.stopPropagation());

    // â”€â”€ BOOT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    (async function boot() {
      const savedState = getCurrentState();
      localStorage.setItem('cropai_state', savedState);
      updateStatePill(savedState);

      ALLOWED_PAGES = await fetchMyPermissions();

      applyRoleAccess();
      loadCurrentPage();
    })();

    // â”€â”€ BACKEND HEALTH CHECK â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function checkBackend() {
      const pill = document.getElementById('backend-status');
      try {
        const res = await fetch('/health', { cache: 'no-store' });
        if (res.ok) {
          pill.textContent = 'BACKEND ONLINE';
          pill.classList.remove('offline');
          pill.classList.add('online');
        } else throw new Error();
      } catch {
        pill.textContent = 'BACKEND OFFLINE';
        pill.classList.remove('online');
        pill.classList.add('offline');
      }
    }

    checkBackend();
    setInterval(checkBackend, 15000);
  </script>
</body>

</html>
