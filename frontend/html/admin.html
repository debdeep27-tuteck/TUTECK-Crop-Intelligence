<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropAI Admin Panel</title>

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500;600&family=Outfit:wght@300;400&display=swap">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f7f5f0;
            --border: #e0ddd5;
            --border2: #c8c4b8;
            --leaf: #378c50;
            --leaf-dark: #3d6a49;
            --text: #1a1a18;
            --text2: #33332e;
            --text3: #8e8e0c;
            --red: #c0392b;
            --sky: #2f8b47;
            --mono: 'DM Mono', monospace;
            --head: 'DM Serif Display', serif;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
        }

        body {
            padding: 30px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(74, 124, 89, .08), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, .06), transparent 45%);
            pointer-events: none;
        }

        .page {
            max-width: 1400px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-family: var(--head);
            font-size: 32px;
            color: var(--leaf);
        }

        .subtitle {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--text3);
            margin-top: 5px;
        }

        .logout-btn {
            height: 42px;
            padding: 0 18px;
            border: none;
            background: var(--red);
            color: white;
            border-radius: 6px;
            font-family: var(--mono);
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, .75);
            backdrop-filter: blur(6px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .05);
        }

        .section-title {
            font-family: var(--head);
            font-size: 22px;
            color: var(--leaf);
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 16px;
        }

        .input,
        .select {
            height: 42px;
            border: 1px solid var(--border2);
            border-radius: 6px;
            padding: 0 12px;
            font-size: 14px;
        }

        .btn {
            height: 42px;
            border: none;
            background: var(--leaf);
            color: white;
            border-radius: 6px;
            padding: 0 14px;
            cursor: pointer;
            font-family: var(--mono);
        }

        .btn:hover {
            background: var(--leaf-dark);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text2);
            border: 1px solid var(--border2);
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, .04);
        }

        .icon-btn:disabled {
            filter: blur(0.1px);
            opacity: .3;
            cursor: not-allowed;
        }

        .icon-btn:disabled:hover {
            filter: blur(0.1px);
        }

        .add-user-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 20, 15, .45);
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            width: 460px;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            box-shadow: 0 30px 70px rgba(0, 0, 0, .25);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-family: var(--head);
            font-size: 22px;
            color: var(--leaf);
        }

        .modal-close {
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--text2);
            font-size: 20px;
            line-height: 1;
            padding: 4px;
        }

        .modal-close:hover {
            color: var(--red);
        }

        .modal-body {
            padding: 20px 24px;
        }

        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            display: block;
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--text2);
            margin-bottom: 6px;
        }

        .field-group .input,
        .field-group .select {
            width: 100%;
        }

        .field-hidden {
            display: none;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 16px 24px 22px;
        }

        .modal-footer .btn,
        .modal-footer .btn-secondary {
            padding: 0 20px;
        }

        .table-wrap {
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border2);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(74, 124, 89, .12);
            color: var(--leaf);
            font-size: 12px;
            font-weight: 600;
        }

        .action-btn {
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 6px;
            font-size: 12px;
        }

        .delete-btn {
            background: #fbe4e1;
            color: var(--red);
        }

        .icon-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            vertical-align: middle;
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        .icon-btn.restrict-off {
            color: var(--red);
        }

        .icon-btn.restrict-off:hover {
            background: #fbe4e1;
        }

        .icon-btn.restrict-on {
            color: var(--leaf);
        }

        .icon-btn.restrict-on:hover {
            background: rgba(74, 124, 89, .12);
        }

        .icon-btn.delete-icon {
            color: var(--red);
        }

        .icon-btn.delete-icon:hover {
            background: #fbe4e1;
        }

        .icon-btn.edit-icon {
            color: var(--leaf-dark);
        }

        .icon-btn.edit-icon:hover {
            background: rgba(74, 124, 89, .12);
        }

        .perm-th {
            text-align: center !important;
            white-space: nowrap;
        }

        .perm-td {
            text-align: center;
        }

        .perm-td input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--leaf);
            cursor: pointer;
        }

        .actions-cell {
            white-space: nowrap;
        }

        .permission-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            background: white;
        }

        .role-title {
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--leaf);
        }

        .checkbox-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-list label {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .save-btn {
            width: 100%;
        }

        .msg {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-family: var(--mono);
            font-size: 12px;
        }

        .error {
            background: #fdecea;
            color: #c0392b;
        }

        .success {
            background: #e9f7ef;
            color: #1e8449;
        }

        .show {
            display: block;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-btn {
            height: 42px;
            padding: 0 18px;
            border: none;
            border-radius: 6px;
            background: var(--sky);
            color: #fff;
            cursor: pointer;
            font-family: var(--mono);
            transition: .2s;
        }

        .nav-btn:hover {
            opacity: .9;
        }

        .admin-only {
            display: none;
        }

        @media(max-width:1000px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class=" page">

        <div class="header">

            <div>
                <div class="title">CropAI Admin Panel</div>
                <div class="subtitle">User Management & Role Permissions</div>
            </div>

            <div class="header-actions">

                <button class="nav-btn" onclick="goToMain()">
                    Crop-Intelligence Dashboard
                </button>

                <button class="nav-btn admin-only" id="adminBtn" onclick="goToAdmin()">
                    Admin Panel
                </button>

                <button class="logout-btn" onclick="logout()">
                    Logout
                </button>

            </div>

        </div>

        <div id="errorBox" class="msg error"></div>
        <div id="successBox" class="msg success"></div>

        <div class="card">

            <div class="section-title">
                Users
            </div>

            <div class="add-user-row">
                <button class="btn" onclick="openUserModal()">
                    + Add user
                </button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr id="usersHeadRow">
                            <th>Email</th>
                            <th>Role</th>
                            <th class="perm-th">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="usersBody">

                    </tbody>

                </table>
            </div>

        </div>

    </div>

    <div class="modal-overlay" id="userModalOverlay" onclick="if(event.target===this) closeUserModal()">
        <div class="modal-card">

            <div class="modal-header">
                <div class="modal-title" id="userModalTitle">Add user</div>
                <button class="modal-close" onclick="closeUserModal()">&times;</button>
            </div>

            <div class="modal-body">

                <div class="field-group">
                    <label class="field-label">Email</label>
                    <input class="input" id="modalEmail" placeholder="name@example.com">
                </div>

                <div class="field-group" id="passwordGroup">
                    <label class="field-label">Password</label>
                    <input class="input" id="modalPassword" type="password" placeholder="At least 6 characters">
                </div>

                <div class="field-group">
                    <label class="field-label">Role</label>
                    <select class="select" id="modalRole" onchange="onModalRoleChange()">
                        <option value="admin">Admin</option>
                        <option value="analyst">Analyst</option>
                        <option value="farmer">Farmer</option>
                        <option value="state_admin">State Admin</option>
                        <option value="district_admin">District Admin</option>
                    </select>
                </div>

                <div class="field-group field-hidden" id="stateGroup">
                    <label class="field-label">State</label>
                    <select class="select" id="modalState" onchange="onModalStateChange()">
                        <option value="">Select a state</option>
                    </select>
                </div>

                <div class="field-group field-hidden" id="districtGroup">
                    <label class="field-label">District</label>
                    <select class="select" id="modalDistrict">
                        <option value="">Select a district</option>
                    </select>
                </div>

                <div class="field-group" id="statusGroup">
                    <label class="field-label">Status</label>
                    <select class="select" id="modalStatus">
                        <option value="active">Active</option>
                        <option value="restricted">Restricted</option>
                    </select>
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeUserModal()">Cancel</button>
                <button class="btn" onclick="saveUserModal()">Save user</button>
            </div>

        </div>
    </div>

    <script>

        const SESSION_KEY = "cropai_session";

        function showError(msg) {
            const e = document.getElementById("errorBox");
            e.innerText = msg;
            e.classList.add("show");
            setTimeout(() => e.classList.remove("show"), 4000);
        }
        function goToMain() {
            window.location.href = "/dashboard";
        }

        function goToAdmin() {
            window.location.href = "/admin";
        }
        function showSuccess(msg) {
            const e = document.getElementById("successBox");
            e.innerText = msg;
            e.classList.add("show");
            setTimeout(() => e.classList.remove("show"), 4000);
        }

        function getSession() {
            const raw = localStorage.getItem(SESSION_KEY);

            if (!raw) {
                window.location = "/";
                return null;
            }

            return JSON.parse(raw);
        }

        const session = getSession();

        if (!session) {
            throw new Error();
        }

        // This backend's session object only carries { token, email, role,
        // state, district, loggedInAt } — no uid/id field. So identity is
        // matched by email (case-insensitive). id fields are still checked
        // first in case the backend adds one later.
        function isSelfUser(user) {
            if (!user) return false;

            const sessionIdCandidates = [
                session.uid, session.id, session._id, session.userId, session.user_id
            ].filter(v => v !== undefined && v !== null);

            const userIdCandidates = [
                user.uid, user.id, user._id, user.userId, user.user_id
            ].filter(v => v !== undefined && v !== null);

            const idMatch = sessionIdCandidates.length && userIdCandidates.length &&
                sessionIdCandidates.some(sid =>
                    userIdCandidates.some(uid => String(sid) === String(uid))
                );

            if (idMatch) return true;

            if (session.email && user.email) {
                return String(session.email).trim().toLowerCase() === String(user.email).trim().toLowerCase();
            }

            return false;
        }

        function authHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + session.token
            };
        }

        // ── Add/Edit user modal ──────────────────────────────────────────

        // Sample state → district mapping. Extend this with your real data.
        const STATES_DISTRICTS = {
            tripura: ['Dhalai', 'Gomati', 'Khowai', 'North Tripura', 'Sepahijala', 'South Tripura', 'Unakoti', 'West Tripura'],
            meghalaya: ['East Garo Hills', 'East Jaintia Hills', 'East Khasi Hills', 'Eastern West Khasi Hills',
                'North Garo Hills', 'Ri Bhoi', 'South Garo Hills', 'South West Garo Hills',
                'South West Khasi Hills', 'West Garo Hills', 'West Jaintia Hills', 'West Khasi Hills'],
            rajasthan: ['Ajmer', 'Alwar', 'Banswara', 'Baran', 'Barmer', 'Bharatpur', 'Bhilwara', 'Bikaner', 'Bundi',
                'Chittorgarh', 'Churu', 'Dausa', 'Dholpur', 'Dungarpur', 'Hanumangarh', 'Jaipur', 'Jaisalmer',
                'Jalore', 'Jhalawar', 'Jhunjhunu', 'Jodhpur', 'Karauli', 'Kota', 'Nagaur', 'Pali', 'Pratapgarh',
                'Rajsamand', 'Sawai Madhopur', 'Sikar', 'Sirohi', 'Sri Ganganagar', 'Tonk', 'Udaipur']
        };

        let modalMode = "create"; // "create" | "edit"
        let modalEditingUid = null;

        function populateStateOptions() {
            const stateSelect = document.getElementById("modalState");
            stateSelect.innerHTML = `<option value="">Select a state</option>` +
                Object.keys(STATES_DISTRICTS)
                    .map(s => `<option value="${s}">${s}</option>`)
                    .join("");
        }

        function onModalRoleChange() {
            const role = document.getElementById("modalRole").value;

            const stateGroup = document.getElementById("stateGroup");
            const districtGroup = document.getElementById("districtGroup");

            const needsState = role === "state_admin" || role === "district_admin";
            const needsDistrict = role === "district_admin";

            stateGroup.classList.toggle("field-hidden", !needsState);
            districtGroup.classList.toggle("field-hidden", !needsDistrict);

            if (!needsState) document.getElementById("modalState").value = "";
            if (!needsDistrict) document.getElementById("modalDistrict").value = "";
        }

        function onModalStateChange() {
            const state = document.getElementById("modalState").value;
            const districtSelect = document.getElementById("modalDistrict");

            const districts = STATES_DISTRICTS[state] || [];
            districtSelect.innerHTML = `<option value="">Select a district</option>` +
                districts.map(d => `<option value="${d}">${d}</option>`).join("");
        }

        function openUserModal(user) {
            modalMode = user ? "edit" : "create";
            modalEditingUid = user ? user.uid : null;

            document.getElementById("userModalTitle").innerText = user ? "Edit user" : "Add user";

            populateStateOptions();

            document.getElementById("modalEmail").value = user ? user.email : "";
            document.getElementById("modalPassword").value = "";
            document.getElementById("modalPassword").placeholder =
                user ? "Leave blank to keep current password" : "At least 6 characters";
            document.getElementById("modalRole").value = user ? user.role : "admin";
            document.getElementById("modalStatus").value = user ? user.status : "active";

            // Status only makes sense once the account exists.
            document.getElementById("statusGroup").classList.toggle("field-hidden", !user);

            onModalRoleChange();

            if (user && user.state) {
                document.getElementById("modalState").value = user.state;
                onModalStateChange();
                if (user.district) document.getElementById("modalDistrict").value = user.district;
            } else {
                onModalStateChange();
            }

            document.getElementById("userModalOverlay").classList.add("show");
        }

        function closeUserModal() {
            document.getElementById("userModalOverlay").classList.remove("show");
        }

        async function saveUserModal() {

            const email = document.getElementById("modalEmail").value.trim();
            const password = document.getElementById("modalPassword").value;
            const role = document.getElementById("modalRole").value;
            const state = document.getElementById("modalState").value;
            const district = document.getElementById("modalDistrict").value;

            if (!email || (modalMode === "create" && !password)) {
                showError("Please fill all required fields.");
                return;
            }

            if ((role === "state_admin" || role === "district_admin") && !state) {
                showError("Please select a state for this role.");
                return;
            }
            if (role === "district_admin" && !district) {
                showError("Please select a district for this role.");
                return;
            }

            let res, data;

            if (modalMode === "create") {

                res = await fetch("/api/users", {
                    method: "POST",
                    headers: authHeaders(),
                    body: JSON.stringify({ email, password, role, state, district })
                });
                data = await res.json();

                if (!res.ok) {
                    showError(data.error);
                    return;
                }

                showSuccess("User created.");

            } else {

                const body = { email, role, state, district };
                if (password) body.password = password;

                res = await fetch(`/api/users/${modalEditingUid}`, {
                    method: "PATCH",
                    headers: authHeaders(),
                    body: JSON.stringify(body)
                });
                data = await res.json();

                if (!res.ok) {
                    showError(data.error);
                    return;
                }

                const statusValue = document.getElementById("modalStatus").value;
                const editingUser = currentUsers.find(u => u.uid === modalEditingUid);
                if (statusValue !== (data.status || "active") && !isSelfUser(editingUser)) {
                    await fetch(`/api/users/${modalEditingUid}/restrict`, {
                        method: "PATCH",
                        headers: authHeaders(),
                        body: JSON.stringify({ restricted: statusValue === "restricted" })
                    });
                }

                showSuccess("User updated.");
            }

            closeUserModal();
            loadUsers();
        }

        // Pages every role can potentially have. Since /api/users now returns
        // each user's own "pages" list, we derive the full column set from
        // whatever the backend hands back (falls back to a safe default).
        const DEFAULT_ALL_PAGES = ["/dashboard", "/irrigation", "/recommend-page", "/alerts", "/disease", "/yield-detect"];
        let allPages = DEFAULT_ALL_PAGES;

        function buildUsersHead() {

            const headRow = document.getElementById("usersHeadRow");

            const pageHeaders = allPages
                .map(page => `<th class="perm-th">${page}</th>`)
                .join("");

            headRow.innerHTML = `
<th>Email</th>
<th>Role</th>
${pageHeaders}
<th class="perm-th">Actions</th>
`;
        }

        let currentUsers = [];

        function roleLabel(role) {
            return {
                admin: "Admin",
                analyst: "Analyst",
                farmer: "Farmer",
                state_admin: "State Admin",
                district_admin: "District Admin",
            }[role] || role;
        }

        function editUser(uid) {
            const user = currentUsers.find(u => u.uid === uid);
            if (user) openUserModal(user);
        }

        async function loadUsers() {

            const res = await fetch("/api/users", {
                headers: authHeaders()
            });

            if (!res.ok) {
                showError("Admin authorization failed.");
                return;
            }

            const users = await res.json();
            currentUsers = users;

            // Union of every page seen across users, keeping the default order first.
            const seen = new Set(DEFAULT_ALL_PAGES);
            users.forEach(u => (u.pages || []).forEach(p => seen.add(p)));
            allPages = DEFAULT_ALL_PAGES.filter(p => seen.has(p))
                .concat([...seen].filter(p => !DEFAULT_ALL_PAGES.includes(p)));

            buildUsersHead();

            const tbody = document.getElementById("usersBody");

            tbody.innerHTML = "";

            users.forEach(user => {

                const userPages = user.pages || [];
                const isSelf = isSelfUser(user);
                const isRestricted = user.status === "restricted";

                const pageCells = allPages.map(page => `
<td class="perm-td">
<input type="checkbox"
data-uid="${user.uid}"
data-page="${page}"
${userPages.includes(page) ? "checked" : ""}
onchange="toggleUserPagePermission(this)"
title="${page}">
</td>
`).join("");

                tbody.innerHTML += `
<tr>
<td>${user.email}</td>
<td>
<span class="role-badge">${roleLabel(user.role)}</span>
</td>
${pageCells}
<td class="actions-cell">
<button class="icon-btn ${isRestricted ? "restrict-on" : "restrict-off"}"
title="${isSelf ? "You can't restrict your own account" : (isRestricted ? "Unrestrict user" : "Restrict user")}"
${isSelf ? "disabled" : `onclick="restrictUser('${user.uid}')"`}>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
stroke-linecap="round" stroke-linejoin="round">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
</svg>
</button>
<button class="icon-btn edit-icon"
title="Edit user"
onclick="editUser('${user.uid}')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
stroke-linecap="round" stroke-linejoin="round">
<path d="M12 20h9"/>

        async function toggleUserPagePermission(checkbox) {

            const uid = checkbox.dataset.uid;
            const page = checkbox.dataset.page;

            // Read current state straight from the row's own checkboxes so we
            // send the full, correct page list for this one user.
            const row = checkbox.closest("tr");
            const pages = [...row.querySelectorAll("input[type=checkbox]")]
                .filter(cb => cb.checked)
                .map(cb => cb.dataset.page);

            const res = await fetch(`/api/users/${uid}/permissions`, {
                method: "PATCH",
                headers: authHeaders(),
                body: JSON.stringify({ pages })
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.error);
                checkbox.checked = !checkbox.checked;
                return;
            }

            showSuccess(`${page} permission updated.`);
        }

        async function restrictUser(uid) {

            const targetUser = currentUsers.find(u => u.uid === uid);
            if (isSelfUser(targetUser)) {
                showError("You can't restrict your own account.");
                return;
            }

            const res = await fetch(`/api/users/${uid}/restrict`, {
                method: "PATCH",
                headers: authHeaders(),
                body: JSON.stringify({})  // no "restricted" flag = toggle current state
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.error);
                return;
            }

            showSuccess(
                data.status === "restricted"
                    ? `${data.email} has been restricted.`
                    : `${data.email} has been reactivated.`
            );

            loadUsers();
        }

        async function deleteUser(uid) {

            const targetUser = currentUsers.find(u => u.uid === uid);
            if (isSelfUser(targetUser)) {
                showError("You can't delete your own account.");
                return;
            }

            if (!confirm("Delete this user?"))
                return;

            const res = await fetch(`/api/users/${uid}`, {
                method: "DELETE",
                headers: authHeaders()
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.error);
                return;
            }

            showSuccess("User deleted.");
            loadUsers();
        }

        function logout() {

            localStorage.removeItem(
                SESSION_KEY
            );

            window.location = "/";
        }

        (async function () {

            if (session.role !== "admin") {
                document.body.innerHTML =
                    "<h2 style='padding:40px'>Admin access required</h2>";
                return;
            }

            await loadUsers();

        })();
    </script>
